<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="light" />

    <!-- Browser Tab Title -->
    <title>CallPulse</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="CallPulse — Modern Contact & Communication Management" />
    <meta
      name="description"
      content="CallPulse is an intuitive contact directory and communication workspace. Easily manage directory contacts, organize favorites, view call logs, and reach people via phone, email, or WhatsApp with one tap."
    />
    <meta
      name="keywords"
      content="CallPulse, contact management, phonebook directory, address book, CRM, call history, communications workspace, contacts organizer"
    />
    <meta name="author" content="CallPulse" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://callpulse.app" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="application-name" content="CallPulse" />
    <meta name="apple-mobile-web-app-title" content="CallPulse" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://callpulse.app" />
    <meta property="og:site_name" content="CallPulse" />
    <meta property="og:title" content="CallPulse — Modern Contact & Communication Management" />
    <meta
      property="og:description"
      content="Organize contacts, track call records, and reach people faster with CallPulse's modern web directory."
    />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />
    <meta property="og:image:alt" content="CallPulse Logo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://callpulse.app" />
    <meta name="twitter:title" content="CallPulse — Modern Contact & Communication Management" />
    <meta
      name="twitter:description"
      content="Organize contacts, track call records, and reach people faster with CallPulse's modern web directory."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo512.png" />
    <meta name="twitter:image:alt" content="CallPulse App Icon" />

    <!-- Preconnect Fonts for Optimal Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "CallPulse",
        "url": "https://callpulse.app",
        "description": "CallPulse is an intuitive contact directory and communication workspace. Easily manage directory contacts, organize favorites, view call logs, and reach people via phone, email, or WhatsApp with one tap.",
        "applicationCategory": "BusinessApplication, CommunicationApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript. Requires HTML5.",
        "softwareVersion": "1.0.0",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "publisher": {
          "@type": "Organization",
          "name": "CallPulse",
          "url": "https://callpulse.app",
          "logo": {
            "@type": "ImageObject",
            "url": "https://callpulse.app/logo512.png"
          }
        }
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run CallPulse.</noscript>
    <div id="root"></div>
  </body>
</html>
